<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RBX TOPUP</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#090b18,#151b38,#24134a);
  color:white;
}

.container{
  width:100%;
  max-width:520px;
  margin:auto;
  padding:25px 18px 40px;
}

.logo{
  text-align:center;
  font-size:32px;
  font-weight:900;
  margin:20px 0 5px;
}

.logo span{
  color:#00ff88;
}

.subtitle{
  text-align:center;
  color:#aaa;
  margin-bottom:25px;
}

.card{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  border-radius:20px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}

label{
  display:block;
  margin-bottom:8px;
  font-weight:bold;
}

input{
  width:100%;
  padding:15px;
  border-radius:12px;
  border:1px solid #444;
  background:#101321;
  color:white;
  outline:none;
  font-size:16px;
  margin-bottom:18px;
}

input:focus{
  border-color:#00ff88;
}

.packages{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.package{
  padding:18px 10px;
  border-radius:15px;
  border:1px solid #444;
  background:#101321;
  color:white;
  cursor:pointer;
  text-align:center;
  transition:.2s;
}

.package:hover{
  border-color:#00ff88;
  transform:translateY(-2px);
}

.package.active{
  border:2px solid #00ff88;
  background:rgba(0,255,136,.12);
}

.robux{
  font-size:20px;
  font-weight:bold;
}

.price{
  color:#00ff88;
  margin-top:6px;
}

.button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:16px;
  margin-top:18px;
  background:#00e879;
  color:#07100c;
  font-size:17px;
  font-weight:900;
  cursor:pointer;
}

.button:hover{
  background:#35ff9c;
}

.info{
  text-align:center;
  color:#aaa;
  font-size:13px;
  line-height:1.6;
}

.status{
  display:none;
  margin-top:15px;
  padding:14px;
  border-radius:12px;
  background:rgba(0,255,136,.1);
  border:1px solid #00ff88;
  color:#00ff88;
  text-align:center;
}

.footer{
  text-align:center;
  color:#777;
  font-size:12px;
  margin-top:30px;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">
    RBX <span>TOPUP</span>
  </div>

  <div class="subtitle">
    Top Up Robux dengan mudah
  </div>

  <div class="card">

    <label>Username Roblox</label>
    <input
      id="username"
      type="text"
      placeholder="Masukkan username Roblox"
      autocomplete="off"
    >

    <label>Pilih Paket Robux</label>

    <div class="packages">

      <div class="package active" onclick="selectPackage(this,'80 Robux')">
        <div class="robux">80 Robux</div>
        <div class="price">Rp15.000</div>
      </div>

      <div class="package" onclick="selectPackage(this,'400 Robux')">
        <div class="robux">400 Robux</div>
        <div class="price">Rp65.000</div>
      </div>

      <div class="package" onclick="selectPackage(this,'800 Robux')">
        <div class="robux">800 Robux</div>
        <div class="price">Rp120.000</div>
      </div>

      <div class="package" onclick="selectPackage(this,'1700 Robux')">
        <div class="robux">1700 Robux</div>
        <div class="price">Rp240.000</div>
      </div>

    </div>

    <button class="button" onclick="topup()">
      LANJUTKAN
    </button>

    <div class="status" id="status"></div>

  </div>

  <div class="card info">
    <b>⚡ Proses Cepat</b><br>
    Pesanan akan diproses setelah pembayaran terverifikasi.
    <br><br>

    <b>🔒 Aman</b><br>
    Jangan pernah memberikan password Roblox kepada siapa pun.
  </div>

  <div class="footer">
    © 2026 RBX TOPUP
  </div>

</div>

<script>

let selectedPackage = "80 Robux";

function selectPackage(element, packageName){

  document.querySelectorAll(".package")
    .forEach(function(item){
      item.classList.remove("active");
    });

  element.classList.add("active");

  selectedPackage = packageName;
}

function topup(){

  const username =
    document.getElementById("username").value.trim();

  const status =
    document.getElementById("status");

  if(username === ""){
    status.style.display = "block";
    status.style.color = "#ff7777";
    status.style.borderColor = "#ff5555";
    status.innerHTML =
      "❌ Masukkan username Roblox terlebih dahulu.";
    return;
  }

  status.style.display = "block";
  status.style.color = "#00ff88";
  status.style.borderColor = "#00ff88";

  status.innerHTML =
    "✅ Pesanan dibuat untuk <b>" +
    username +
    "</b><br>" +
    "Paket: <b>" +
    selectedPackage +
    "</b><br><br>" +
    "Silakan lanjutkan ke sistem pembayaran resmi.";

}

</script>

</body>
</html>
