<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NUTS STORE — Top Up Robux</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      color:#fff;
      background:linear-gradient(135deg,#080b1c,#171a36 55%,#241d4b);
      min-height:100vh;
    }
    .wrap{max-width:760px;margin:auto;padding:34px 18px 50px}
    header{text-align:center;margin-bottom:28px}
    .logo{font-size:46px;font-weight:900;letter-spacing:-2px}
    .logo span{color:#00ee8a}
    .sub{color:#aaaec0;font-size:20px;margin-top:8px}
    .card{
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.18);
      border-radius:28px;
      padding:28px;
      box-shadow:0 18px 50px rgba(0,0,0,.22);
      backdrop-filter:blur(10px);
    }
    label{display:block;font-size:18px;font-weight:800;margin:0 0 10px}
    input,select{
      width:100%;padding:18px;border-radius:18px;
      border:1px solid #44485b;background:#0c0f20;color:#fff;
      font-size:17px;outline:none;
    }
    input:focus{border-color:#00ee8a}
    .section{margin-bottom:24px}
    .packs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .pack{
      border:2px solid #36394b;background:#0c0f20;
      border-radius:22px;padding:22px 12px;text-align:center;
      cursor:pointer;transition:.2s;
    }
    .pack:hover{transform:translateY(-2px)}
    .pack.selected{border-color:#00ee8a;background:rgba(0,238,138,.12)}
    .robux{font-size:24px;font-weight:900}
    .price{color:#00ee8a;font-size:19px;margin-top:8px;font-weight:800}
    button{
      width:100%;border:0;border-radius:18px;padding:19px;
      background:#00df82;color:#07120d;font-size:19px;font-weight:900;
      cursor:pointer;margin-top:4px;
    }
    button:hover{background:#00ee8a}
    .summary{display:none;margin-top:20px;background:#0c0f20;border-radius:20px;padding:20px}
    .row{display:flex;justify-content:space-between;gap:15px;padding:9px 0;color:#c7cad6}
    .row strong{color:#fff}
    .wa{display:block;text-decoration:none;text-align:center;margin-top:15px}
    .info{margin-top:22px;text-align:center;color:#b9bdcb;line-height:1.7}
    .info strong{color:#fff}
    .warning{font-size:13px;color:#9fa3b3;margin-top:12px}
    footer{text-align:center;color:#85899a;font-size:13px;margin-top:24px}
    @media(max-width:520px){
      .logo{font-size:38px}
      .card{padding:22px}
      .packs{gap:10px}
      .pack{padding:18px 8px}
      .robux{font-size:21px}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="logo">NUTS <span>STORE</span></div>
      <div class="sub">Top Up Robux dengan mudah ⚡</div>
    </header>

    <section class="card">
      <div class="section">
        <label for="username">Username Roblox</label>
        <input id="username" type="text" maxlength="30" placeholder="Masukkan username Roblox">
        <div class="warning">Jangan masukkan password Roblox.</div>
      </div>

      <div class="section">
        <label>Pilih Paket Robux</label>
        <div class="packs" id="packs"></div>
      </div>

      <button onclick="lanjutkan()">LANJUTKAN</button>

      <div class="summary" id="summary">
        <div class="row"><span>Username</span><strong id="sumUser">-</strong></div>
        <div class="row"><span>Paket</span><strong id="sumPack">-</strong></div>
        <div class="row"><span>Total</span><strong id="sumPrice">-</strong></div>

        <a class="wa" id="waLink" target="_blank">
          <button type="button">ORDER VIA WHATSAPP</button>
        </a>
      </div>
    </section>

    <section class="card info">
      <div>⚡ <strong>Proses Cepat</strong><br>Pesanan diproses setelah pembayaran terverifikasi.</div>
      <br>
      <div>🔒 <strong>Aman</strong><br>Jangan pernah memberikan password Roblox kepada siapa pun.</div>
    </section>

    <footer>© 2026 NUTS STORE</footer>
  </main>

<script>
  // ==============================
  // GANTI NOMOR WHATSAPP DI SINI
  // Format: kode negara + nomor, tanpa +, spasi, atau 0 di depan.
  // Contoh Indonesia: 628123456789
  // ==============================
  const WHATSAPP = "628XXXXXXXXXX";

  const packages = [
    {robux: 80, price: 15000},
    {robux: 400, price: 65000},
    {robux: 800, price: 120000},
    {robux: 1000, price: 150000},
    {robux: 1700, price: 240000}
  ];

  let selected = null;

  const packs = document.getElementById("packs");

  packages.forEach((item, index) => {
    const el = document.createElement("div");
    el.className = "pack" + (index === 0 ? " selected" : "");
    el.innerHTML = `<div class="robux">${item.robux.toLocaleString("id-ID")} Robux</div>
                    <div class="price">Rp${item.price.toLocaleString("id-ID")}</div>`;
    el.onclick = () => {
      selected = item;
      document.querySelectorAll(".pack").forEach(x => x.classList.remove("selected"));
      el.classList.add("selected");
    };
    packs.appendChild(el);
  });

  selected = packages[0];

  function lanjutkan() {
    const username = document.getElementById("username").value.trim();

    if (!username) {
      alert("Masukkan username Roblox terlebih dahulu.");
      document.getElementById("username").focus();
      return;
    }

    document.getElementById("sumUser").textContent = username;
    document.getElementById("sumPack").textContent =
      selected.robux.toLocaleString("id-ID") + " Robux";
    document.getElementById("sumPrice").textContent =
      "Rp" + selected.price.toLocaleString("id-ID");

    const message =
      `Halo NUTS STORE, saya ingin order Top Up Robux.%0A%0A` +
      `Username Roblox: ${encodeURIComponent(username)}%0A` +
      `Paket: ${selected.robux} Robux%0A` +
      `Harga: Rp${selected.price.toLocaleString("id-ID")}%0A%0A` +
      `Mohon info cara pembayarannya.`;

    document.getElementById("waLink").href =
      `https://wa.me/${WHATSAPP}?text=${message}`;

    document.getElementById("summary").style.display = "block";
    document.getElementById("summary").scrollIntoView({behavior:"smooth",block:"center"});
  }
</script>
</body>
</html>
